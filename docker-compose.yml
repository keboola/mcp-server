services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: keboola_mcp
      POSTGRES_USER: keboola_mcp
      POSTGRES_PASSWORD: keboola_mcp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keboola_mcp"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  postgres_data:
