[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keboola-mcp-server"
version = "1.75.0"
description = "MCP server for interacting with Keboola Connection"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Keboola", email = "devel@keboola.com" }]
dependencies = [
    "fastmcp == 3.4.4",
    "mcp == 1.28.1",
    "httpx ~= 0.28",
    "httpx-retries~=0.5",
    "jsonpath-ng ~= 1.8",
    "jsonschema ~= 4.26",
    "pyjwt ~= 2.13",
    "json-log-formatter ~= 1.1",
    "cryptography ~= 49.0",
    "pydantic ~= 2.13.0",
    "sqlglot ~= 30.0",
    "toon-format ~= 0.9.0b1",
    "pyyaml ~= 6.0",
]
[project.optional-dependencies]
codestyle = [
    "ruff ~= 0.16",
]
tests = [
    "pytest ~= 9.0",
    "pytest-asyncio ~= 1.4",
    "pytest-cov ~= 7.0",
    "pytest-datadir ~= 1.8",
    "pytest-mock ~= 3.15",
    "python-dateutil ~= 2.9",
    "python-dotenv ~= 1.2",
]
integtests = [
    "kbcstorage ~= 0.9",
    "requests ~= 2.34",
]
dev = [
    "tox ~= 4.35",
]

[project.scripts]
keboola_mcp_server = "keboola_mcp_server.cli:main"
keboola-mcp-server = "keboola_mcp_server.cli:main"

[tool.setuptools.package-data]
"keboola_mcp_server.resources" = ["storage-schema.json"]

[tool.uv]
# Dependency cooldown (supply-chain hardening): never resolve a package version
# published within the last 7 days. Freshly published malicious releases are
# typically detected and yanked within hours to a few days, so a 7-day buffer
# removes most of that attack window before a version can reach our lock file.
# This is a resolution-time filter — it applies whenever `uv lock` regenerates
# the lock; CI installs with `uv sync --frozen` and is unaffected.
# Temporarily relax this (e.g. `--exclude-newer` on the CLI) when an urgent
# security fix needs to be picked up before the window elapses.
exclude-newer = "7 days"

[tool.hatch.build.targets.wheel]
packages = ["src/keboola_mcp_server"]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "strict"
log_cli = false
log_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(name)s: %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# On top of ruff's (already broad) default rule set:
extend-select = [
    "I",     # isort -- import sorting; replaces isort + flake8-isort
    "UP",    # pyupgrade -- modern Python syntax
    "E402",  # module-level import not at top of file; was enforced by flake8. Keeps the
             # deliberate `# noqa: E402` markers in tests/tools/test_data_apps.py meaningful
             # instead of RUF100 flagging them as unused.
]
# BLE001: this server's tool/error boundary is built on deliberate broad `except Exception` catches
# (never crash, always return a structured error/best-effort result) -- see keboola_mcp_server.errors.
# tool_errors and the many "best effort, log and continue" catches throughout tools/.
ignore = ["BLE001"]

[tool.ruff.lint.per-file-ignores]
# Re-exports for the package's public API; unused within the module itself.
"src/keboola_mcp_server/tools/components/__init__.py" = ["F401"]
"src/keboola_mcp_server/tools/flow/__init__.py" = ["F401"]
# Test/integtest-only: blocking subprocess calls and naive datetimes used for comparison are
# intentional there and carry none of the production-code risk the rules guard against.
"tests/**" = ["ASYNC220", "ASYNC221", "DTZ001", "DTZ007", "S102"]
"integtests/**" = ["ASYNC220", "ASYNC221"]

[tool.ruff.format]
# Matches black's former `skip-string-normalization`: leave existing quote style alone.
quote-style = "preserve"

[tool.tox]
requires = ["tox>=4.23"]
env_list = ["python", "ruff", "check-tools-docs"]
labels = { cs-fix = ["ruff-fix"], cs = ["ruff"] }

[tool.tox.env_run_base]
description = "Run tests"
extras = ["tests"]
package = "wheel"
wheel_build_env = ".pkg"
commands = [
    [
        "pytest",
        { replace = "posargs", default = [
            "tests",
            "--cov=keboola_mcp_server",
            "--cov-report=term-missing",
            "--cov-report=xml",
            "--junitxml",
            "./test-results.xml",
        ], extend = true },
    ],
]

[tool.tox.env.integtests]
description = "Run integration tests"
extras = ["tests", "integtests"]
pass_env = [
    "INTEGTEST_STORAGE_API_URL",
    "INTEGTEST_POOL_STORAGE_API_URL",
    "INTEGTEST_STORAGE_TOKENS",
    "INTEGTEST_WORKSPACE_SCHEMAS",
    "INTEGTEST_STORAGE_TOKEN_PRJ2",
    "INTEGTEST_WORKSPACE_SCHEMA_PRJ2",
    "INTEGTEST_STORAGE_TOKEN_STORAGE_BRANCHES",
    "INTEGTEST_LOCK_TTL_MINUTES",
    "INTEGTEST_LOCK_POLL_INTERVAL_SECONDS",
    "INTEGTEST_LOCK_MAX_WAIT_MINUTES",
]
commands = [
    [
        "pytest",
        { replace = "posargs", default = [
            "integtests",
            "--junitxml",
            "./integtest-results.xml",
        ], extend = true },
    ],
]

[tool.tox.env.ruff]
description = "Check formatting and run lint checks using ruff"
package = "skip"
deps = [
    "ruff ~= 0.16",
]
commands = [
    ["ruff", "format", "--check", "src/", "tests/", "integtests/"],
    ["ruff", "check", "src/", "tests/", "integtests/"],
]

[tool.tox.env.ruff-fix]
description = "Auto-fix formatting and lint issues using ruff (replaces the old black + isort envs)"
package = "skip"
deps = [
    "ruff ~= 0.16",
]
commands = [
    ["ruff", "format", "src/", "tests/", "integtests/"],
    ["ruff", "check", "--fix", "src/", "tests/", "integtests/"],
]

[tool.tox.env.check-tools-docs]
description = "Check if TOOLS.md is up-to-date with tool definitions"
extras = []
package = "wheel"
wheel_build_env = ".pkg"
allowlist_externals = ["git"]
commands = [
    ["python", "-m", "keboola_mcp_server.generate_tool_docs"],
    ["git", "diff", "--exit-code", "TOOLS.md"],
]
