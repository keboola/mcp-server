name: Build and Push Docker Image

on:
  push:
    tags:
      # Production releases (deployed to production stacks).
      - 'v*'         # MCP server, e.g. v1.70.0
      - 'agent-v*'   # In Platform Agent, e.g. agent-v1.70.0
      # Canary releases (deployed to canary-orion stacks).
      - 'canary-orion-v*'      # MCP server canary, e.g. canary-orion-v1.70.0-dev.1
      - 'canary-orion-agent*'  # In Platform Agent canary, e.g. canary-orion-agent-v1.70.0-dev.1
      # Dev releases (deployed to testing stacks).
      - 'dev-v*'       # MCP server dev, e.g. dev-v1.70.0-dev.1
      - 'dev-agent*'   # In Platform Agent dev, e.g. dev-agent-v1.70.0-dev.1

permissions:
  contents: read
  actions: read
  packages: read

env:
  SERVICE_IMAGE_NAME: "keboola/mcp-server"
  ECR_REGION: "us-east-1"
  ECR_REPOSITORY: "keboola/mcp-server"
  ECR_PUSH_ROLE: "arn:aws:iam::968984773589:role/kbc-ecr-McpServerPushRole"
  GCP_REGISTRY: "us-central1-docker.pkg.dev"
  GCP_REPOSITORY: "keboola-prod-artifacts/mcp-server/mcp-server"
  GCP_IDENTITY_PROVIDER: "projects/388088979044/locations/global/workloadIdentityPools/github/providers/github"
  GCP_SERVICE_ACCOUNT: "mcp-server-ci-push@keboola-prod-artifacts.iam.gserviceaccount.com"
  ACR_REGISTRY: "keboola.azurecr.io"
  ACR_REPOSITORY: "mcp-server"
  ACR_USERNAME: "mcp-server-push"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_PUSH_USER }}
          password: ${{ secrets.DOCKERHUB_PUSH_TOKEN }}

      - name: Login to private registries (ECR, ACR, GCP GAR)
        id: login-private-registries
        uses: ./.github/actions/login-private-registries
        with:
          ecrRegion: ${{ env.ECR_REGION }}
          ecrPushRole: ${{ env.ECR_PUSH_ROLE }}
          gcpRegistry: ${{ env.GCP_REGISTRY }}
          gcpIdentityProvider: ${{ env.GCP_IDENTITY_PROVIDER }}
          gcpServiceAccount: ${{ env.GCP_SERVICE_ACCOUNT }}
          acrRegistry: ${{ env.ACR_REGISTRY }}
          acrUsername: ${{ env.ACR_USERNAME }}
          acrPassword: ${{ secrets.MCP_SERVER_ACR_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.SERVICE_IMAGE_NAME }}
            ${{ steps.login-private-registries.outputs.ecrRegistry }}/${{ env.ECR_REPOSITORY }}
            ${{ env.GCP_REGISTRY }}/${{ env.GCP_REPOSITORY }}
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}
          tags: |
            type=sha,format=long
            # Production: clean v* / agent-v* tags -> production stacks.
            type=raw,value=production-${{ github.sha }},enable=${{ (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/agent-v')) && !contains(github.ref, '-dev.') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-dev.') }}
            # Canary: canary-orion-v* / canary-orion-agent* tags -> canary-orion stacks.
            type=raw,value=canary-orion-${{ github.sha }},enable=${{ startsWith(github.ref, 'refs/tags/canary-orion-') }}
            # Dev: dev-v* / dev-agent* tags -> testing stacks.
            type=raw,value=dev-${{ github.sha }},enable=${{ startsWith(github.ref, 'refs/tags/dev-') }}

      # Build for tests (single-arch, load into daemon)
      - name: Build Docker image
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: ./Dockerfile # Explicitly specify the Dockerfile path
          tags: "keboola/mcp-server:ci"
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run simple e2e test
        env:
          INTEGTEST_STORAGE_TOKENS: ${{ secrets.INTEGTEST_STORAGE_TOKENS }}
          INTEGTEST_POOL_STORAGE_API_URL: ${{ vars.INTEGTEST_POOL_STORAGE_API_URL }}
        run: |
          set -euo pipefail
          STORAGE_API_TOKEN=$(echo "$INTEGTEST_STORAGE_TOKENS" | cut -d' ' -f1) \
          STORAGE_API_URL="$INTEGTEST_POOL_STORAGE_API_URL" \
          ./tests/docker/ci.sh

      # Push multi-arch image (no load)
      - name: Push Docker image
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger image tag update for canary-orion
        uses: ./.github/actions/trigger-image-tag-update
        if: startsWith(github.ref, 'refs/tags/canary-orion-v')
        with:
          helm-chart: "mcp-server"
          image-tag: canary-orion-${{ github.sha }}
          github-app-private-key: ${{ secrets.GITOPS_KBC_STACKS_TRIGGER_APP_PVK }}

      - name: Trigger image tag update for production
        uses: ./.github/actions/trigger-image-tag-update
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-dev.')
        with:
          helm-chart: "mcp-server"
          image-tag: production-${{ github.sha }}
          github-app-private-key: ${{ secrets.GITOPS_KBC_STACKS_TRIGGER_APP_PVK }}

      - name: Trigger image tag update for testing (dev)
        uses: ./.github/actions/trigger-image-tag-update
        if: startsWith(github.ref, 'refs/tags/dev-v')
        with:
          helm-chart: "mcp-server"
          image-tag: dev-${{ github.sha }}
          github-app-private-key: ${{ secrets.GITOPS_KBC_STACKS_TRIGGER_APP_PVK }}

      - name: Trigger image tag update for canary-orion (agent)
        uses: ./.github/actions/trigger-image-tag-update
        if: startsWith(github.ref, 'refs/tags/canary-orion-agent')
        with:
          helm-chart: "mcp-server-agent"
          image-tag: canary-orion-${{ github.sha }}
          github-app-private-key: ${{ secrets.GITOPS_KBC_STACKS_TRIGGER_APP_PVK }}

      - name: Trigger image tag update for production (agent)
        uses: ./.github/actions/trigger-image-tag-update
        if: startsWith(github.ref, 'refs/tags/agent-v') && !contains(github.ref, '-dev.')
        with:
          helm-chart: "mcp-server-agent"
          image-tag: production-${{ github.sha }}
          github-app-private-key: ${{ secrets.GITOPS_KBC_STACKS_TRIGGER_APP_PVK }}

      - name: Trigger image tag update for testing (agent dev)
        uses: ./.github/actions/trigger-image-tag-update
        if: startsWith(github.ref, 'refs/tags/dev-agent')
        with:
          helm-chart: "mcp-server-agent"
          image-tag: dev-${{ github.sha }}
          github-app-private-key: ${{ secrets.GITOPS_KBC_STACKS_TRIGGER_APP_PVK }}

  # Only for production MCP-server releases (vX.Y.Z): create a GitHub Release with
  # auto-generated notes (all PRs merged since the previous tag), then comment on
  # each referenced PR that it shipped in this release. The `startsWith(refs/tags/v)`
  # guard excludes agent-v*, canary-orion-*, and dev-* tags.
  release-notes:
    name: Release notes
    needs: build-and-push
    if: needs.build-and-push.result == 'success' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-dev.')
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the GitHub Release
      pull-requests: write   # comment on referenced PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create GitHub Release with generated notes
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Idempotent: a re-run (or partial retry) must not fail just because the
          # release already exists — and must not re-comment on the PRs either.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            gh release create "$TAG" --verify-tag --generate-notes
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment on PRs included in the release
        if: steps.release.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          notes=$(gh release view "$TAG" --json body -q .body)
          # Auto-generated notes reference each PR as ".../pull/123" (and sometimes #123).
          prs=$(printf '%s\n' "$notes" | grep -oE '(/pull/|#)[0-9]+' | grep -oE '[0-9]+' | sort -un) || true
          for pr in $prs; do
            gh pr comment "$pr" \
              --body "🚀 Shipped in release [\`$TAG\`](https://github.com/$REPO/releases/tag/$TAG)."
          done

  kaibench:
    name: KaiBench Evaluation
    needs: build-and-push
    if: needs.build-and-push.result == 'success' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-dev.')
    uses: ./.github/workflows/kaibench.yml
    secrets: inherit
